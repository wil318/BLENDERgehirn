name: Blender build (cloud)

# Baut das Gehirnmodell headless mit Blender auf einem GitHub-Runner.
# Läuft nur noch von Hand (Reiter „Actions“ → „Blender build (cloud)“ → „Run workflow“)
# und schreibt NICHTS mehr ins Repo zurück: Die Ergebnisse (GLB, meta.json,
# Rendering, Icons) liegen danach als Download „brain-build“ beim jeweiligen Lauf.
# Normalerweise wird lokal gebaut (build.sh) und das Ergebnis selbst committet.
on:
  workflow_dispatch:
    inputs:
      render:
        description: "Cycles-Rendering (Vorschaubild + Icons) erzeugen"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: blender
  cancel-in-progress: true

env:
  BLENDER_VERSION: "5.3.0"
  BLENDER_SERIES: "5.3"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender ${{ env.BLENDER_VERSION }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          curl -sSL "https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            | tar -xJ -C ~/blender --strip-components=1

      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libegl1 libgl1 libglu1-mesa > /dev/null

      - name: Build model
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.render }}" = "false" ]; then ARGS="--no-render"; fi
          ~/blender/blender -b --factory-startup --python-exit-code 1 --python blender/build_brain.py -- $ARGS 2>&1 | tee build.log
          ls -la web/models web/img web/icons blender

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: brain-build
          path: |
            web/models/
            web/img/
            web/icons/
            build.log
